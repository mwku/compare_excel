name: Build executables

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            python-architecture: x86
            python-version: '3.11'
            pandas-version: '2.0.3'
            numpy-specifier: 'numpy<2'
            artifact: windows-x86
          - runner: windows-2022
            python-architecture: x64
            python-version: '3.13'
            pandas-version: '3.0.6'
            numpy-specifier: 'numpy'
            artifact: windows-x64
          - runner: windows-11-arm
            python-architecture: arm64
            python-version: '3.13'
            pandas-version: '3.0.6'
            numpy-specifier: 'numpy'
            artifact: windows-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python-architecture }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas==${{ matrix.pandas-version }}" "${{ matrix.numpy-specifier }}" customtkinter openpyxl pyinstaller

      - name: Build executable
        run: >-
          pyinstaller
          --clean
          --noconfirm
          --onefile
          --windowed
          --name excel-${{ matrix.artifact }}
          main.py

      - name: Upload executable
        uses: actions/upload-artifact@v5
        with:
          name: excel-${{ matrix.artifact }}
          path: dist/excel-${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download executables
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: excel-windows-*
          merge-multiple: true

      - name: Create release and upload executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber