name: Build executables

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            python-architecture: x86
            artifact: windows-x86
          - runner: windows-2022
            python-architecture: x64
            artifact: windows-x64
          - runner: windows-11-arm
            python-architecture: arm64
            artifact: windows-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-architecture }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build executable
        run: >-
          pyinstaller
          --clean
          --noconfirm
          --onefile
          --name excel-${{ matrix.artifact }}
          main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: excel-${{ matrix.artifact }}
          path: dist/excel-${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: excel-windows-*
          merge-multiple: true

      - name: Create release and upload executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "$GITHUB_REF_NAME"